<script>
/* ================= 数据层：只认线上文件（本机不留正式数据） =================
   ① 首帧：直接渲染 data/ideas.js 的内容 —— 发布时会自动打版本戳 ?v=hash，首帧即最新；
   ② 首帧后：再 fetch 一次源站副本（cache:no-store）兜底，版本戳没更新也能百毫秒内校正；
   ③ 页面上的 ✎ 编辑只在本次会话内存生效，刷新即恢复线上内容（正式发布请用内容控制台）。 */
const seedTag=document.querySelector('script[src^="data/ideas.js"]');
const SEED_URL=seedTag?seedTag.getAttribute('src').split('?')[0]:'data/ideas.js';
const SEED_VER=(function(){
  try{const m=/[?&]v=([^&"']+)/.exec(seedTag?seedTag.getAttribute('src'):'');return m?m[1]:'';}catch(e){return '';}
})();
function sealOf(data){
  const s=JSON.stringify(data);
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return s.length.toString(36)+'.'+h.toString(36);
}
let liveSeal=sealOf(typeof IDEAS_SEED!=='undefined'?IDEAS_SEED:[]);
/* 从源站文本里取出 JSON 部分（控制台写出的就是严格 JSON） */
function parseSeedText(text){
  try{
    const s=String(text).replace(/^\uFEFF/,'');
    const i=s.indexOf('=');
    if(i<0)return null;
    const arr=/^\s*=\s*\[/.test(s.slice(i));
    const a=s.indexOf(arr?'[':'{',i), b=s.lastIndexOf(arr?']':'}');
    if(a<0||b<=a)return null;
    return JSON.parse(s.slice(a,b+1));
  }catch(e){return null;}
}
const ideaKey=w=>String(w&&(w.title||w.text)||'').trim().slice(0,80);
/* 标题（缺省用正文前 80 字）视为同一条灵感，文件优先，避免文件更新后出现重复卡片 */
function mergeWithFile(seed,local){
  const out=seed.map(w=>Object.assign({},w));
  const seen=Object.create(null);
  out.forEach(w=>{seen[ideaKey(w)]=1;});
  local.forEach(w=>{
    if(!w||typeof w!=='object'||!ideaKey(w))return;
    const k=ideaKey(w);
    if(seen[k])return;
    seen[k]=1;
    out.push(Object.assign({title:'',text:'',tags:[],date:''},w));
  });
  return out;
}
/* 老版本把正式数据存在浏览器里，现在只认线上文件：顺手清掉遗留副本 */
(function(){
  try{
    localStorage.removeItem('isle_ideas_v1');
    localStorage.removeItem('isle_ideas_v1_seal');
  }catch(e){}
})();
let IDEAS=JSON.parse(JSON.stringify(IDEAS_SEED));
function persist(){/* 不落盘：正式数据只认 data/ideas.js */}

/* ===== 源站校验 / 手动强同步：绕开静态缓存，部署后刷新即时生效 ===== */
function syncFromServer(force){
  if(typeof fetch!=='function')return;
  let ctrl=null,timer=0;
  try{if(typeof AbortController==='function'){ctrl=new AbortController();timer=setTimeout(()=>ctrl.abort(),6000);}}catch(e){}
  const opt={cache:'no-store'};
  if(ctrl)opt.signal=ctrl.signal;
  let pr;try{pr=fetch(SEED_URL+'?v='+Date.now(),opt);}catch(e){clearTimeout(timer);if(force)toast('⚠️ 拉取失败，请检查网络后重试');return;}
  pr.then(r=>r.ok?r.text():null).then(t=>{
    clearTimeout(timer);
    if(!t){if(force)toast('⚠️ 拉取失败，请检查网络后重试');return;}
    const fresh=parseSeedText(t);
    if(!fresh){if(force)toast('⚠️ 线上数据格式异常，未同步');return;}
    const s=sealOf(fresh);
    if(s===liveSeal){
      if(force)toast('✅ 已是最新版本'+(SEED_VER?'（v='+String(SEED_VER).slice(0,8)+'）':''));
      return;
    }
    const merged=mergeWithFile(fresh,IDEAS);
    const same=JSON.stringify(merged)===JSON.stringify(IDEAS);
    liveSeal=s;
    IDEAS=merged;
    if(!same){render();toast('🔄 已同步文件里的最新内容');}
    else if(force){toast('✅ 已是最新版本');}
  }).catch(()=>{clearTimeout(timer);if(force)toast('⚠️ 拉取失败，请检查网络后重试');});
}
window.addEventListener('pageshow',e=>{if(e.persisted)syncFromServer();});

let tag='全部', kw='';
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
const hueOf=s=>210+hash(s||'star')%120;

function render(){
  const cnt={};
  IDEAS.forEach(w=>(w.tags||[]).forEach(t=>cnt[t]=(cnt[t]||0)+1));
  const tags=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  $('chips').innerHTML=`<button class="chip2${tag==='全部'?' on':''}" data-t="全部">全部 ${IDEAS.length}</button>`
    +tags.map(t=>`<button class="chip2${t===tag?' on':''}" data-t="${esc(t)}">${esc(t)} ${cnt[t]}</button>`).join('')
    +`<button class="chip2 resetbtn" id="resetBtn" title="立即从线上拉取最新内容（绕开所有缓存）">↻ 重新拉取线上最新</button>`;
  document.querySelectorAll('.chip2[data-t]').forEach(b=>b.onclick=()=>{tag=b.dataset.t;render();});
  $('resetBtn').onclick=()=>{
    if(confirm('重新从线上拉取最新内容？\n\n页面上的临时编辑会被线上内容替换（正式数据以 data/ideas.js 为准）。')){
      syncFromServer(true);
    }
  };

  const k=kw.toLowerCase();
  const list=IDEAS.filter(w=>{
    const okTag=tag==='全部'||(w.tags||[]).includes(tag);
    const blob=((w.title||'')+' '+(w.text||'')+' '+(w.tags||[]).join(' ')).toLowerCase();
    return okTag&&(!k||blob.includes(k));
  });
  $('total').textContent='共 '+list.length+' 条灵感';
  $('empty').style.display=list.length?'none':'block';
  $('wall').innerHTML=list.map(w=>{
    const gi=IDEAS.indexOf(w);
    const h=hueOf((w.tags&&w.tags[0])||w.title);
    return `<div class="icard" style="--h:${h}">
      <div class="ops">
        <button class="op" data-edit="${gi}" title="编辑">✎</button>
        <button class="op danger" data-del="${gi}" title="删除">🗑</button>
      </div>
      ${w.title?`<h3>${esc(w.title)}</h3>`:''}
      <p class="itext">${esc(w.text).replace(/\n/g,'<br>')}</p>
      ${(w.tags&&w.tags.length)?`<div class="itags">${w.tags.map(t=>`<span class="itag" style="--h:${hueOf(t)}">${esc(t)}</span>`).join('')}</div>`:''}
      ${w.date?`<div class="ifoot"><span class="idate">✦ ${esc(w.date)}</span></div>`:''}
    </div>`;
  }).join('');
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delIdea(Number(b.dataset.del)));
}
$('kwInput').addEventListener('input',e=>{kw=e.target.value.trim();render();});

/* ===== ✨ AI 帮我写：联网才显示，只往输入框填字，不自动保存 ===== */
const AI_URL='https://isle-ai-d6gdm9o8ya1aa2b0c-1492115002.ap-shanghai.app.tcloudbase.com/ai';
function aiReady(){const b=$('aiBtn');if(b)b.style.display=navigator.onLine?'':'none';}
async function aiAsk(prompt,system){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch(AI_URL,{method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:prompt,system:system,max_tokens:500})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!d.text)throw new Error('empty');
    return d.text;
  }finally{clearTimeout(timer);}
}
function aiJson(text){
  try{
    const s=String(text).replace(/```json/gi,'').replace(/```/g,'').trim();
    const a=s.indexOf('{'),b=s.lastIndexOf('}');
    if(a<0||b<0)return null;
    return JSON.parse(s.slice(a,b+1));
  }catch(e){return null;}
}
$('aiBtn').onclick=async()=>{
  const src=$('efText').value.trim()||$('efTitle').value.trim();
  if(!src){toast('先在「正文」里写一句话，再让 AI 帮你扩写');return;}
  const btn=$('aiBtn'),label=btn.textContent;
  btn.disabled=true;btn.textContent='生成中…';
  try{
    const t=await aiAsk(
      '我的原话：'+src+'\n请把它扩写成一条灵感，只返回 JSON：{"title":"不超过20字","text":"80到150字","tags":["标签1","标签2"],"date":""}',
      '你是个人网站「热带屿」灵感墙的写作助手。语言真诚具体、有画面感，不编造我没提过的事实。只输出 JSON，不要解释。');
    const o=aiJson(t);
    if(o){
      if(o.title)$('efTitle').value=String(o.title).slice(0,60);
      if(o.text)$('efText').value=String(o.text);
      if(o.tags)$('efTags').value=[].concat(o.tags).slice(0,6).join(', ');
      toast('✨ 已填好，看完记得点保存');
    }else{
      $('efText').value=t;toast('✨ 已填入正文，可自行调整');
    }
  }catch(e){
    toast(navigator.onLine?'AI 暂时不可用，请稍后再试':'当前离线，AI 功能不可用');
  }finally{
    btn.disabled=false;btn.textContent=label;
  }
};
window.addEventListener('online',aiReady);
window.addEventListener('offline',aiReady);
aiReady();

function parseTags(s){return [...new Set(s.split(/[,，、;；\s]+/).map(t=>t.trim()).filter(Boolean))].slice(0,6);}
function openAdd(){
  editIdx=-1;
  $('emTitle').textContent='✏️ 记一条灵感';
  $('efTitle').value='';$('efText').value='';$('efTags').value='';$('efDate').value='';
  openModal();setTimeout(()=>$('efText').focus(),60);
}
function openEdit(i){
  const w=IDEAS[i];if(!w)return;editIdx=i;
  $('emTitle').textContent='✏️ 编辑灵感';
  $('efTitle').value=w.title||'';$('efText').value=w.text||'';
  $('efTags').value=(w.tags||[]).join(', ');$('efDate').value=w.date||'';
  openModal();setTimeout(()=>$('efText').focus(),60);
}
$('emSave').onclick=()=>{
  const text=$('efText').value.trim();
  if(!text){toast('正文还没写哦');return;}
  const item={title:$('efTitle').value.trim(),text,tags:parseTags($('efTags').value),date:$('efDate').value.trim()};
  if(editIdx<0){IDEAS.unshift(item);toast('✦ 已加入本机预览（刷新恢复线上内容）');}
  else{IDEAS[editIdx]=item;toast('✅ 已更新（仅本机预览）');}
  persist();closeModal();render();
};
$('emCancel').onclick=closeModal;
$('emClose').onclick=closeModal;
$('editModal').onclick=e=>{if(e.target===$('editModal'))closeModal();};
$('addBtn').onclick=openAdd;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function delIdea(i){
  const w=IDEAS[i];if(!w)return;
  if(confirm('删除这条灵感「'+(w.title||w.text.slice(0,14)+'…')+'」？')){
    IDEAS.splice(i,1);persist();render();toast('🗑️ 已删除（仅本机预览）');
  }
}

/* ================= 轻提示 ================= */
let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

const sp=document.getElementById('space');
for(let i=0;i<110;i++){const s=document.createElement('div');s.className='star';
const z=Math.random()*1.8+.6;s.style.width=s.style.height=z+'px';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
s.style.setProperty('--d',(Math.random()*4+2)+'s');s.style.animationDelay=Math.random()*5+'s';
sp.appendChild(s);}
render();
syncFromServer();

<script>
/* ===== 主题切换：星空屿 ⇄ 热带海（存 isle_theme_v1） ===== */
(function(){
  var root=document.documentElement, KEY='isle_theme_v1';
  var btn=document.getElementById('themeBtn');
  if(!btn) return;
  function isBeach(){ return root.getAttribute('data-theme')==='beach'; }
  function paint(){
    if(isBeach()){ btn.textContent='✨'; btn.title='切回星空屿'; btn.setAttribute('aria-label','切回星空屿'); }
    else{ btn.textContent='🌊'; btn.title='切到热带海'; btn.setAttribute('aria-label','切到热带海'); }
  }
  btn.addEventListener('click',function(){
    if(isBeach()){
      root.removeAttribute('data-theme');
      try{ localStorage.setItem(KEY,'star'); }catch(e){}
    }else{
      root.setAttribute('data-theme','beach');
      try{ localStorage.setItem(KEY,'beach'); }catch(e){}
    }
    paint();
  });
  paint();
})();
</script>
