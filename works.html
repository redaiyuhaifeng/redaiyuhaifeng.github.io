<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.space{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 10%,var(--haze-violet),transparent 55%),radial-gradient(ellipse at 85% 80%,var(--haze-blue),transparent 55%),linear-gradient(180deg,var(--bg),var(--sky-2) 55%,var(--sky-3))}
.star{position:absolute;background:var(--surface-solid);border-radius:50%;animation:tw var(--d,3s) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.nebula{position:absolute;border-radius:50%;filter:blur(90px)}
.n1{width:460px;height:460px;top:-120px;left:-120px;background:radial-gradient(circle,var(--violet-45),transparent 70%)}
.n2{width:420px;height:420px;bottom:-100px;right:-90px;background:radial-gradient(circle,var(--cyan-35),transparent 70%)}
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:2px;max-width:94vw;padding:8px 12px;border-radius:999px;background:var(--nav-bg);border:1px solid var(--nav-line);backdrop-filter:blur(14px)}
.logo{font-weight:800;font-size:1rem;padding:0 12px 0 6px;background:linear-gradient(120deg,var(--logo-1),var(--logo-2),var(--logo-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav a{font-size:.86rem;color:var(--nav-text);padding:7px 13px;border-radius:999px;transition:.25s}
.nav a:hover,.nav a.active{color:var(--text-strong);background:var(--nav-active-bg)}
.wrap{position:relative;z-index:2;max-width:1060px;margin:0 auto;padding:110px 20px 50px}
.page-head{text-align:center;margin-bottom:30px}
.page-head h1{font-size:clamp(1.8rem,5vw,2.4rem);background:linear-gradient(120deg,var(--head-grad-1),var(--head-grad-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.page-head p{color:var(--text-dim);font-size:.88rem;margin-top:8px;letter-spacing:.15em}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip2{font-size:.8rem;color:var(--text-mid);background:var(--surface-1);border:1px solid var(--chip2-line);padding:7px 15px;border-radius:999px;cursor:pointer;transition:.25s;font-family:inherit}
.chip2.on{background:var(--violet-30);border-color:var(--lav-60);color:var(--text-strong)}
.addbtn{background:linear-gradient(120deg,var(--accent),var(--accent-2))!important;border:none!important;color:var(--text-strong)!important;box-shadow:0 4px 14px var(--brand-40)}
.addbtn:hover{transform:translateY(-2px)}
.resetbtn{color:var(--text-faint)!important;font-size:.72rem!important}
.resetbtn:hover{color:var(--danger-soft)!important;border-color:var(--danger-45)!important}
.sinput{flex:0 1 220px;background:var(--input-bg);border:1px solid var(--white-18);border-radius:999px;padding:9px 18px;color:var(--text-strong);font-size:.88rem;font-family:inherit}
.sinput:focus{outline:none;border-color:var(--accent-soft);box-shadow:0 0 10px var(--violet-35)}
.cnt{font-size:.78rem;color:var(--text-faint);width:100%}
.masonry{column-count:3;column-gap:18px}
@media(max-width:900px){.masonry{column-count:2}}
@media(max-width:600px){.masonry{column-count:1}}
.wcard{position:relative;break-inside:avoid;margin-bottom:18px;border-radius:18px;padding:20px 22px;background:var(--surface-1);border:1px solid hsla(var(--h),70%,68%,.35);backdrop-filter:blur(10px);transition:.3s;opacity:1;animation:fadeup .6s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* 兜底：动画未出帧 / 系统要求减少动效时，卡片保持完全可见 */
@media (prefers-reduced-motion:reduce){.wcard{animation:none!important;opacity:1;transform:none}}
.wcard:hover{transform:translateY(-5px);border-color:hsla(var(--h),80%,72%,.7);box-shadow:0 14px 36px hsla(var(--h),70%,50%,.25)}

.ops{position:absolute;top:12px;right:14px;display:flex;gap:6px;opacity:0;transition:.25s;z-index:3}

/* ══════════════ 3D 翻转卡片 ══════════════
   外层 #wall .wcard 只做 3D 舞台（id 提权，覆盖 theme.css 的统一卡片 hover），
   正反面画在 .card-inner 里；.ops（编辑/删除）留在舞台层，不参与翻转。 */
#wall .wcard{
  position:relative;
  padding:0;
  height:268px;
  background:none;
  border:0;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  perspective:1000px;
}
#wall .wcard:hover{
  transform:none;
  background:none;
  border:0;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
#wall .card-inner{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
}
#wall .wcard:hover .card-inner,
#wall .wcard.flipped .card-inner{transform:rotateY(180deg)}

#wall .face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  border-radius:18px;
  overflow:hidden;
  background:var(--surface-1);
  border:1px solid hsla(var(--h),70%,68%,.35);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
#wall .face.back{transform:rotateY(180deg)}

/* 正面：封面色块 + 分类 + 标题 */
#wall .face.front .cover{
  flex:1 1 auto;min-height:96px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
  background:
    radial-gradient(circle at 78% 20%,hsla(var(--h),80%,68%,.5),transparent 62%),
    linear-gradient(135deg,hsla(var(--h),70%,52%,.4),hsla(var(--h),70%,38%,.08));
  border-bottom:1px solid hsla(var(--h),70%,68%,.22);
}
#wall .face.front .fbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:9px}
#wall .face.front .wcat{margin-bottom:0;align-self:flex-start}
#wall .face.front h3{
  margin-bottom:0;font-size:1.02rem;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* 背面：简介 + 标签 + 进入链接 */
#wall .face.back{padding:18px 18px 16px}
#wall .face.back .wcat{margin-bottom:10px;align-self:flex-start}
#wall .face.back .wdesc{
  font-size:.85rem;line-height:1.8;color:var(--text-mid);

}
#wall .face.back .wtags{margin-top:10px}
#wall .face.back .wfoot{margin-top:auto;padding-top:10px}
#wall .face.back .wlink{position:relative;z-index:3}
#wall .wcard .ops{top:10px;right:12px;z-index:6}

@media(max-width:600px){#wall .wcard{height:252px}}
@media (prefers-reduced-motion:reduce){#wall .card-inner{transition:none}}
</style>

<script>
/* ================= 数据层：文件为基座 + 本机编辑增量 =================
   data/works.js 每次改动都会产生新的「文件指纹」：
   ▸ 指纹相同 → 本机快照基于当前文件，保留本机编辑（刷新不变，无闪动）
   ▸ 指纹不同 / 老版本快照 → 以文件内容为准，仅把本机独有的作品追加回来
   整个过程在首次渲染前同步完成，不额外联网、不重载页面。 */
const STORE_KEY='isle_works_v1';
const SEAL_KEY=STORE_KEY+'_seal';
function sealOf(data){
  const s=JSON.stringify(data);
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return s.length.toString(36)+'.'+h.toString(36);
}
const FILE_SEAL=sealOf(typeof WORKS_SEED!=='undefined'?WORKS_SEED:[]);
const workKey=w=>String(w&&(w.title||w.desc)||'').trim();
function readLocal(){
  try{const v=JSON.parse(localStorage.getItem(STORE_KEY));if(Array.isArray(v))return v;}catch(e){}
  return null;
}
function readSeal(){try{return localStorage.getItem(SEAL_KEY)||'';}catch(e){return '';}}
function writeLocal(list,seal){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(list));localStorage.setItem(SEAL_KEY,seal);}catch(e){}
}
/* 标题（缺省用描述）视为同一件作品，文件优先，避免文件更新后出现重复卡片 */
function mergeWithFile(seed,local){
  const out=seed.map(w=>Object.assign({},w));
  const seen=Object.create(null);
  out.forEach(w=>{seen[workKey(w)]=1;});
  local.forEach(w=>{
    if(!w||typeof w!=='object'||!workKey(w))return;
    const k=workKey(w);
    if(seen[k])return;
    seen[k]=1;
    out.push(Object.assign({title:'',cat:'其他',desc:'',link:'',tags:[],date:''},w));
  });
  return out;
}
let fileSynced=false;
let WORKS=(function(){
  const seed=JSON.parse(JSON.stringify(WORKS_SEED));
  const local=readLocal();
  if(!local){writeLocal(seed,FILE_SEAL);return seed;}
  if(readSeal()===FILE_SEAL)return local;
  fileSynced=true;
  const merged=mergeWithFile(seed,local);
  writeLocal(merged,FILE_SEAL);
  return merged;
})();
function persist(){writeLocal(WORKS,FILE_SEAL);}

const CATS={'网站':'🌐','设计':'🎨','写作':'✍️','视频':'🎬','其他':'✨'};
let tag='全部', kw='';
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
const hueOf=s=>210+hash(s||'star')%120;
function parseTags(s){return [...new Set(s.split(/[,，、;；\s]+/).map(t=>t.trim()).filter(Boolean))].slice(0,6);}

function render(){
  const cnt={};
  WORKS.forEach(w=>{if(w.cat)cnt[w.cat]=(cnt[w.cat]||0)+1;});
  const cats=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  $('chips').innerHTML=`<button class="chip2${tag==='全部'?' on':''}" data-t="全部">全部 ${WORKS.length}</button>`
    +cats.map(t=>`<button class="chip2${t===tag?' on':''}" data-t="${esc(t)}">${CATS[t]||'✨'} ${esc(t)} ${cnt[t]}</button>`).join('')
    +`<button class="chip2 resetbtn" id="resetBtn" title="丢弃本机编辑，重新读取文件里的初始内容">↺ 恢复文件初始内容</button>`;
  document.querySelectorAll('.chip2[data-t]').forEach(b=>b.onclick=()=>{tag=b.dataset.t;render();});
  $('resetBtn').onclick=()=>{
    if(confirm('将丢弃本页在浏览器中的全部编辑，恢复为文件里写死的初始内容（种子数据）。\n\n若本机编辑里有想保留的作品，请先导出备份！\n\n确定恢复吗？')){
      try{localStorage.removeItem(STORE_KEY);localStorage.removeItem(SEAL_KEY);}catch(e){}
      location.reload();
    }
  };

  const k=kw.toLowerCase();
  const list=WORKS.filter(w=>{
    const okTag=tag==='全部'||w.cat===tag||(w.tags||[]).includes(tag);
    const blob=((w.title||'')+' '+(w.desc||'')+' '+(w.cat||'')+' '+(w.tags||[]).join(' ')).toLowerCase();
    return okTag&&(!k||blob.includes(k));
  });
  $('total').textContent='共 '+list.length+' 件作品';
  $('empty').style.display=list.length?'none':'block';
  $('wall').innerHTML=list.map(w=>{
    const gi=WORKS.indexOf(w);
    const h=hueOf(w.cat||w.title);
    const ico=CATS[w.cat]||'✨';
    return `<div class="wcard" style="--h:${h}">
      <div class="ops">
        <button class="op" data-edit="${gi}" title="编辑">✎</button>
        <button class="op danger" data-del="${gi}" title="删除">🗑</button>
      </div>
      <div class="card-inner">
        <div class="face front">
          <div class="cover" aria-hidden="true">${ico}</div>
          <div class="fbody">
            <span class="wcat">${ico} ${esc(w.cat||'其他')}</span>
            <h3>${esc(w.title)}</h3>
          </div>
        </div>
        <div class="face back">
          <span class="wcat">${ico} ${esc(w.cat||'其他')}</span>
          ${w.desc?`<p class="wdesc">${esc(w.desc).replace(/\n/g,'<br>')}</p>`:''}
          ${(w.tags&&w.tags.length)?`<div class="wtags">${w.tags.map(t=>`<span class="wtag">${esc(t)}</span>`).join('')}</div>`:''}
          <div class="wfoot">
            ${w.link?`<a class="wlink" href="${esc(w.link)}" target="_blank" rel="noopener">进入 →</a>`:`<span class="wlink" style="color:var(--text-ghost)">🔗 链接待补充</span>`}
            ${w.date?`<span class="wdate">✦ ${esc(w.date)}</span>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delWork(Number(b.dataset.del)));
}
$('kwInput').addEventListener('input',e=>{kw=e.target.value.trim();render();});

/* ================= 编辑弹窗 ================= */
let editIdx=-1;
function openModal(){$('editModal').classList.add('open');}
function closeModal(){$('editModal').classList.remove('open');editIdx=-1;}
function openAdd(){
  editIdx=-1;
  $('emTitle').textContent='✏️ 展出一件作品';
  $('efTitle').value='';$('efCat').value='网站';$('efDesc').value='';$('efLink').value='';$('efTags').value='';$('efDate').value='';
  openModal();setTimeout(()=>$('efTitle').focus(),60);
}
function openEdit(i){
  const w=WORKS[i];if(!w)return;editIdx=i;
  $('emTitle').textContent='✏️ 编辑作品';
  $('efTitle').value=w.title||'';$('efCat').value=w.cat||'其他';$('efDesc').value=w.desc||'';
  $('efLink').value=w.link||'';$('efTags').value=(w.tags||[]).join(', ');$('efDate').value=w.date||'';
  openModal();setTimeout(()=>$('efTitle').focus(),60);
}
$('emSave').onclick=()=>{
  const title=$('efTitle').value.trim();
  if(!title){toast('标题还没写哦');return;}
  const item={title,cat:$('efCat').value,desc:$('efDesc').value.trim(),link:$('efLink').value.trim(),tags:parseTags($('efTags').value),date:$('efDate').value.trim()};
  if(editIdx<0){WORKS.unshift(item);toast('⭐ 新作品已入馆');}
  else{WORKS[editIdx]=item;toast('✅ 已保存修改');}
  persist();closeModal();render();
};
$('emCancel').onclick=closeModal;
$('emClose').onclick=closeModal;
$('editModal').onclick=e=>{if(e.target===$('editModal'))closeModal();};
$('addBtn').onclick=openAdd;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function delWork(i){
  const w=WORKS[i];if(!w)return;
  if(confirm('删除作品「'+w.title+'」？')){
    WORKS.splice(i,1);persist();render();toast('🗑️ 已删除');
  }
}

/* ================= 轻提示 ================= */
let toastTimer;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

const sp=document.getElementById('space');
for(let i=0;i<110;i++){const s=document.createElement('div');s.className='star';
const z=Math.random()*1.8+.6;s.style.width=s.style.height=z+'px';
s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
s.style.setProperty('--d',(Math.random()*4+2)+'s');s.style.animationDelay=Math.random()*5+'s';
sp.appendChild(s);}
render();
if(fileSynced)setTimeout(()=>toast('🔄 已同步文件里的最新内容'),400);
</script>
<script>
/* ===== 3D 翻转卡片：无 hover 设备点按翻面（只加交互，不碰数据渲染） ===== */
(function(){
  var wall=document.getElementById('wall');
  if(!wall) return;
  function hasHover(){
    try{ return window.matchMedia('(hover:hover) and (pointer:fine)').matches; }
    catch(e){ return true; }
  }
  wall.addEventListener('click',function(e){
    if(hasHover()) return;                                    /* 桌面端由 :hover 翻面 */
    if(!e.target.closest) return;
    if(e.target.closest('a,button')) return;                  /* 链接、编辑/删除按钮不触发翻面 */
    var card=e.target.closest('.wcard');
    if(!card) return;
    card.classList.toggle('flipped');
  });
})();
</script>
<script>
/* ===== 鼠标跟随倾斜：只写在卡片外层 .wcard 上，内层 .card-inner 的翻转不受影响 ===== */
function initCardTilt(){
  var wall=document.getElementById('wall');
  if(!wall) return;
  try{
    if(!window.matchMedia('(hover: hover)').matches) return;                    /* 触屏设备不做倾斜 */
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;   /* 减少动效偏好时关闭 */
  }catch(e){ return; }

  var MAX=8, LIFT=6;            /* 最大倾角 8 度，轻微 translateZ */
  var frame=0, cur=null, last=null;

  /* 归位：.4s 平滑回正，投影一并收回 */
  function reset(el){
    if(!el) return;
    el.style.transition='transform .4s cubic-bezier(.4,0,.2,1), box-shadow .4s ease';
    el.style.transform='perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0)';
    el.style.boxShadow='';
  }

  /* 真正的样式写入只发生在这里（每帧一次） */
  function paint(){
    frame=0;
    if(!cur) return;
    var el=cur.el;
    if(!el.isConnected) return;
    var x=cur.x, y=cur.y;
    el.style.transition='transform .12s linear, box-shadow .12s linear';
    el.style.transform='perspective(1000px) rotateX('+(y*MAX).toFixed(2)+'deg) rotateY('+(-x*MAX).toFixed(2)+'deg) translateZ('+LIFT+'px)';
    el.style.boxShadow=(-x*16).toFixed(1)+'px '+(18+y*10).toFixed(1)+'px 40px var(--tilt-shadow)';
  }

  wall.addEventListener('mousemove',function(e){
    var card=e.target.closest?e.target.closest('.wcard'):null;
    if(card!==last){ if(last) reset(last); last=card; }
    if(!card){ cur=null; return; }
    var r=card.getBoundingClientRect();
    if(!r.width||!r.height) return;
    cur={ el:card,
          x:((e.clientX-r.left)/r.width-.5)*2,    /* -1(左) … 1(右) */
          y:((e.clientY-r.top)/r.height-.5)*2 };  /* -1(上) … 1(下) */
    if(!frame) frame=requestAnimationFrame(paint);  /* rAF 节流 */
  },{passive:true});

  wall.addEventListener('mouseleave',function(){
    cur=null;
    if(last) reset(last);
    last=null;
  });
}
initCardTilt();
</script>
<script>
/* ===== 主题切换：星空屿 ⇄ 热带海（存 isle_theme_v1） ===== */
(function(){
  var root=document.documentElement, KEY='isle_theme_v1';
  var btn=document.getElementById('themeBtn');
  if(!btn) return;
  function isBeach(){ return root.getAttribute('data-theme')==='beach'; }
  function paint(){
    if(isBeach()){ btn.textContent='✨'; btn.title='切回星空屿'; btn.setAttribute('aria-label','切回星空屿'); }
    else{ btn.textContent='🌊'; btn.title='切到热带海'; btn.setAttribute('aria-label','切到热带海'); }
  }
  btn.addEventListener('click',function(){
    if(isBeach()){
      root.removeAttribute('data-theme');
      try{ localStorage.setItem(KEY,'star'); }catch(e){}
    }else{
      root.setAttribute('data-theme','beach');
      try{ localStorage.setItem(KEY,'beach'); }catch(e){}
    }
    paint();
  });
  paint();
})();
</script>
